name: pre-commit
description: 'Run pre-commit tasks'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.13'
    type: string
  pre-commit-tasks:
    description: 'Comma separated list of tasks to run, or single task name'
    required: false
  tasks-to-skip: 
    description: 'Comma separated list of tasks to skip'
    required: false
runs:
  using: 'composite'
  steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit
        shell: bash

      - name: Run pre-commit
        env:
          SKIP: ${{ inputs.tasks-to-skip }}
        run: |
          if [[ -n "${{ inputs.pre-commit-tasks }}" ]]; then
            IFS=',' read -ra TASK_NAMES <<< "${{ inputs.pre-commit-tasks }}"

            for task in "${TASK_NAMES[@]}"; do
              task="$(echo "$task" | xargs)"  # trim whitespace

              echo "Running pre-commit task: $task"
              pre-commit run --all-files "$task"
            done
          else
            pre-commit run --all-files
          fi
        shell: bash
